services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nova_short_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/nova_short?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=nova_short_super_secret_jwt_key_2026_runtime_987654321
      - ADMIN_DEFAULT_EMAIL=admin@novaruntime.com
      - ADMIN_DEFAULT_PASSWORD=admin_change_me_123
      - STORAGE_DIR=/app/storage/downloads
      - DOWNLOAD_MAX_FILE_SIZE_MB=250
    volumes:
      - nova_storage:/app/storage/downloads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: nova_short_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nova_short
    ports:
      - "5432:5432"
    volumes:
      - nova_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nova_short"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nova_short_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nova_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nova_pgdata:
  nova_redisdata:
  nova_storage:

<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo Dark Premium Obsidian -->
  <rect width="1200" height="360" rx="20" fill="#080C15"/>
  
  <!-- Grid Matrix Futurista de Fundo -->
  <g opacity="0.12">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200" stroke="#3B82F6" stroke-width="1"/>
    <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360" stroke="#3B82F6" stroke-width="1"/>
  </g>

  <!-- Gradientes de Glow Neon -->
  <radialGradient id="glow1" cx="50%" cy="40%" r="50%">
    <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#080C15" stop-opacity="0"/>
  </radialGradient>
  <circle cx="600" cy="140" r="300" fill="url(#glow1)"/>

  <!-- Borda Suave com Gradiente -->
  <rect x="1" y="1" width="1198" height="358" rx="19" stroke="url(#borderGrad)" stroke-width="2"/>
  <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="360">
    <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.7"/>
    <stop offset="50%" stop-color="#1E2C48" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.7"/>
  </linearGradient>

  <!-- Tag Superior -->
  <rect x="490" y="38" width="220" height="28" rx="14" fill="#101828" stroke="#3B82F6" stroke-opacity="0.4"/>
  <text x="600" y="56" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">NOVA RUNTIME ECOSYSTEM</text>

  <!-- Título Principal -->
  <text x="600" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1" text-anchor="middle">
    <tspan fill="#F8FAFC">NOVA </tspan>
    <tspan fill="#3B82F6">SHORT</tspan>
  </text>

  <!-- Subtítulo -->
  <text x="600" y="185" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="0.5" text-anchor="middle">
    Plataforma SaaS Profissional de Encurtamento Inteligente &amp; Downloader de Mídia
  </text>

  <!-- Divisor Tecnológico -->
  <line x1="450" y1="215" x2="750" y2="215" stroke="#1E2C48" stroke-width="1.5"/>

  <!-- Badges Tecnológicos -->
  <g transform="translate(180, 245)">
    <!-- Badge 1: Next.js 15 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="#101828" stroke="#1E2C48"/>
      <text x="90" y="26" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Next.js 15 &amp; React 19</text>
    </g>

    <!-- Badge 2: PostgreSQL + BullMQ -->
    <g transform="translate(200, 0)">
      <rect width="200" height="42" rx="10" fill="#101828" stroke="#1E2C48"/>
      <text x="100" y="26" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🐘 PostgreSQL &amp; BullMQ</text>
    </g>

    <!-- Badge 3: YouTube • TikTok • Instagram -->
    <g transform="translate(420, 0)">
      <rect width="220" height="42" rx="10" fill="#101828" stroke="#1E2C48"/>
      <text x="110" y="26" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🎥 YouTube • TikTok • Insta</text>
    </g>

    <!-- Badge 4: SSRF Shielded -->
    <g transform="translate(660, 0)">
      <rect width="180" height="42" rx="10" fill="#101828" stroke="#3B82F6" stroke-opacity="0.4"/>
      <text x="90" y="26" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🛡️ 100% Blindado SSRF</text>
    </g>
  </g>
</svg>

<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo Dark Obsidian Noir -->
  <rect width="1200" height="360" rx="16" fill="#07080B"/>
  
  <!-- Gradiente Suave de Profundidade -->
  <radialGradient id="depthGrad" cx="50%" cy="0%" r="75%">
    <stop offset="0%" stop-color="#141926" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#07080B" stop-opacity="1"/>
  </radialGradient>
  <rect width="1200" height="360" rx="16" fill="url(#depthGrad)"/>

  <!-- Borda Hairline Elegante -->
  <rect x="1" y="1" width="1198" height="358" rx="15" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Tag Superior Minimalista -->
  <rect x="455" y="44" width="290" height="26" rx="13" fill="#0E121B" stroke="rgba(255, 255, 255, 0.1)"/>
  <circle cx="474" cy="57" r="3.5" fill="#10B981"/>
  <text x="608" y="61" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.2" text-anchor="middle">NOVA SHORT • ECOSSISTEMA RUNTIME</text>

  <!-- Título Principal Nítido -->
  <text x="600" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5" text-anchor="middle">
    <tspan fill="#F8FAFC">NOVA </tspan>
    <tspan fill="#94A3B8" font-weight="600">SHORT</tspan>
  </text>

  <!-- Subtítulo Clean -->
  <text x="600" y="188" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" letter-spacing="0.2" text-anchor="middle">
    Encurtamento Inteligente de URLs, Telemetria e Downloader de Mídia de Alta Performance
  </text>

  <!-- Divisor Hairline -->
  <line x1="500" y1="216" x2="700" y2="216" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Badges Técnicos Minimalistas -->
  <g transform="translate(195, 245)">
    <!-- Badge 1: Next.js 15 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="10" fill="#0B0E14" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="90" y="24" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Next.js 15 &amp; React 19</text>
    </g>

    <!-- Badge 2: Concorrência -->
    <g transform="translate(200, 0)">
      <rect width="195" height="38" rx="10" fill="#0B0E14" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="97" y="24" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">1.000 Usuários Concorrentes</text>
    </g>

    <!-- Badge 3: SSRF Hardened -->
    <g transform="translate(415, 0)">
      <rect width="185" height="38" rx="10" fill="#0B0E14" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="92" y="24" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Blindagem SSRF &amp; RFC1918</text>
    </g>

    <!-- Badge 4: PWA Standalone -->
    <g transform="translate(620, 0)">
      <rect width="190" height="38" rx="10" fill="#0B0E14" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="95" y="24" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">PWA Standalone Mobile</text>
    </g>
  </g>
</svg>
